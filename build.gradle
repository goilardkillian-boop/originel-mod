plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.gradle.userdev' version '7.0.170'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

repositories {
    mavenLocal()

    // Vampirism (TeamLapen) - https://github.com/TeamLapen/Vampirism
    maven { url = 'https://maven.maxanier.de/releases' }
    // Werewolves (TeamLapen) - https://github.com/TeamLapen/Werewolves
    maven { url = 'https://maven.paube.de/releases' }
    // Armourer's Workshop, published on Modrinth's maven mirror
    maven { url = 'https://api.modrinth.com/maven' }
}

base {
    archivesName = mod_id
}

// Mojang ships Java 21 to end users starting in 1.20.5, so mods should target Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

// Default run configurations.
runs {
    configureEach {
        systemProperty 'forge.logging.markers', 'REGISTRIES'
        systemProperty 'forge.logging.console.level', 'debug'

        modSource project.sourceSets.main
    }

    client {
        systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
    }

    server {
        systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
        argument '--nogui'
    }

    gameTestServer {
        systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
    }

    data {
        arguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
    }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

// Sets up a dependency configuration called 'localRuntime'.
// Used for optional runtime dependencies that must not leak to consumers of this mod.
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // Specify the version of Minecraft to use.
    implementation "net.neoforged:neoforge:${neo_version}"

    // Vampirism (LGPL-3.0) - faction API used by the Originel faction. Not embedded in the jar.
    compileOnly "de.teamlapen.vampirism:Vampirism:${vampirism_minecraft_version}-${vampirism_version}:api"
    runtimeOnly "de.teamlapen.vampirism:Vampirism:${vampirism_minecraft_version}-${vampirism_version}"

    // Werewolves (LGPL-3.0) - used to resolve player-model conflicts with the Originel form. Not embedded.
    compileOnly "de.teamlapen.werewolves:Werewolves:${werewolves_minecraft_version}-${werewolves_version}"
    runtimeOnly "de.teamlapen.werewolves:Werewolves:${werewolves_minecraft_version}-${werewolves_version}"

    // Armourer's Workshop (CC-BY-NC-SA-3.0) - used by the Anneau de Cendre feature. Not embedded.
    compileOnly "maven.modrinth:armourers-workshop:${armourers_workshop_version}"
    runtimeOnly "maven.modrinth:armourers-workshop:${armourers_workshop_version}"
}

// This block of code expands all declared replace properties in the specified resource targets.
tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
