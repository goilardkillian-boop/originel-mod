# Lycania : L'Originel
# The name of the mod loader type to load - for regular FML @Mod mods it should be javafml
modLoader="javafml" #mandatory

# A version range to match for said mod loader - for regular FML @Mod it will be the FML version.
loaderVersion="${loader_version_range}" #mandatory

# The license for the mod.
license="${mod_license}"

# A URL to refer people to when problems occur with this mod
issueTrackerURL="https://github.com/goilardkillian-boop/originel-mod/issues" #optional

# A list of mods - how many allowed here is determined by the individual mod loader
[[mods]] #mandatory

# The modid of the mod
modId="${mod_id}" #mandatory

# The version number of the mod
version="${mod_version}" #mandatory

# A display name for the mod
displayName="${mod_name}" #mandatory

# A text field displayed in the mod UI
credits="Serveur Lycania" #optional

# A text field displayed in the mod UI
authors="${mod_authors}" #optional

# The description text for the mod (multi line!) (#mandatory)
description='''${mod_description}'''

# Minecraft & loader dependencies
[[dependencies.${mod_id}]] #optional
    modId="neoforge" #mandatory
    type="required" #mandatory
    versionRange="${neo_version_range}" #mandatory
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# Vampirism provides the faction API the Originel faction is built on. Required, must load first.
[[dependencies.${mod_id}]]
    modId="vampirism"
    type="required"
    reason="Le mod s'appuie sur l'API de factions de Vampirism pour creer la faction de l'Originel."
    versionRange="[1.10.0,)"
    ordering="AFTER"
    side="BOTH"

# Werewolves is required to resolve the player-model conflict with the Originel hybrid form.
[[dependencies.${mod_id}]]
    modId="werewolves"
    type="required"
    reason="Le mod gere la coexistence du modele de joueur Hybride avec celui des loups-garous."
    versionRange="[2.0.0,)"
    ordering="AFTER"
    side="BOTH"

# Armourer's Workshop is optional, only needed for the Anneau de Cendre feature.
[[dependencies.${mod_id}]]
    modId="armourers_workshop"
    type="optional"
    reason="Necessaire pour l'Anneau de Cendre, qui convertit un anneau Armourer's Workshop."
    ordering="AFTER"
    side="BOTH"
